# mdev (run by 'uevent mdev', started in rc.boot): load the driver for a device that was just
# plugged in, such as a USB Wi-Fi stick or a game controller. Device files themselves come from
# devtmpfs and keep their owners and modes ("!": mdev makes and changes no device files).
-$MODALIAS=.*   root:root 0660 ! @modprobe "$MODALIAS"
.*              root:root 0660 !
