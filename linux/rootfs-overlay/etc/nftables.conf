#!/sbin/nft -f
# SilverOS firewall: nothing gets in unless you asked for it. Loaded at boot, before the network.
# What goes out is not restricted (SilverOS runs nothing that listens, but a program you start might).
flush ruleset

table inet silver {
	chain input {
		type filter hook input priority 0; policy drop;
		iif "lo" accept
		ct state established,related accept
		ct state invalid drop
		# the answers to our own DHCP requests
		udp sport 67 udp dport 68 accept
		udp sport 547 udp dport 546 accept
		# ping, and the messages the network needs to work
		ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
		ip6 nexthdr icmpv6 icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
		# SSH is opened by rc.boot only when you've set up a key (see there)
	}
	chain forward {
		type filter hook forward priority 0; policy drop;
	}
	chain output {
		type filter hook output priority 0; policy accept;
	}
}
