# SilverOS live USB boot chooser (BIOS + UEFI)
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
set gfxmode=auto
set gfxpayload=keep
terminal_output gfxterm
set theme=($root)/boot/grub/themes/silver/theme.txt
export theme
set timeout=8
set default=silveros

# Tile 1: SilverOS live (the whole system runs from RAM)
menuentry " " --class silveros --id silveros {
    linux /boot/vmlinuz quiet loglevel=3 console=tty1 console=ttyS0,115200
    initrd /boot/rootfs.cpio.xz
}

# Tile 2: Windows, shown only when a Windows Boot Manager is on this PC (UEFI)
if [ "$grub_platform" = "efi" ]; then
    if search --no-floppy --set=winesp --file /EFI/Microsoft/Boot/bootmgfw.efi; then
        menuentry " " --class windows --id windows {
            set root=$winesp
            chainloader /EFI/Microsoft/Boot/bootmgfw.efi
        }
    fi
fi

# Third tile (scroll down): plain-text advanced options
submenu " " --class advanced {
    set theme=
    terminal_output console
    menuentry "@OS_NAME@ (verbose boot)" {
        linux /boot/vmlinuz console=tty1 console=ttyS0,115200
        initrd /boot/rootfs.cpio.xz
    }
    if [ "$grub_platform" = "efi" ]; then menuentry "Firmware setup" { fwsetup }; fi
    menuentry "Reboot"    { reboot }
    menuentry "Power off" { halt }
}
