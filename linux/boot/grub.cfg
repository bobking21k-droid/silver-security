# SilverOS boot menu (BIOS + UEFI)
set timeout=5
set default=0
insmod all_video
insmod gfxterm
terminal_output gfxterm
set gfxmode=auto
set gfxpayload=keep
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue

menuentry "@OS_NAME@ @OS_VERSION@" {
    linux /boot/vmlinuz quiet loglevel=3 console=tty1 console=ttyS0,115200
    initrd /boot/rootfs.cpio.xz
}
menuentry "@OS_NAME@ @OS_VERSION@ (verbose)" {
    linux /boot/vmlinuz console=tty1 console=ttyS0,115200
    initrd /boot/rootfs.cpio.xz
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Firmware setup" { fwsetup }
fi
menuentry "Reboot"    { reboot }
menuentry "Power off" { halt }
