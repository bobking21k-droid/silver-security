name: SilverSecurity
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  SilverSecurity:
    type: application
    platform: iOS
    sources:
      - path: SilverSecurity
    info:
      path: SilverSecurity/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silversecurity.app
        INFOPLIST_KEY_CFBundleDisplayName: Silver Security
    dependencies:
      - target: SilverSecurityWidget
        embed: true
  SilverSecurityWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SilverSecurityWidget
      - path: SilverSecurity/Shared
    info:
      path: SilverSecurityWidget/Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.silversecurity.app.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  SilverSecurityTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SilverSecurityTests
    dependencies:
      - target: SilverSecurity
